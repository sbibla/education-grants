[project]
name = "grant-agent"
version = "0.1.0"
description = "Agent that finds, vets, and drafts education grant applications for nonprofits"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "anthropic>=1.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pypdf>=4.2",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
